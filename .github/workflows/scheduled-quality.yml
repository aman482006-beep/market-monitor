name: Scheduled Market Monitor Quality Check

on:
  schedule:
    # Daily at 03:30 UTC (09:00 IST)
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/scheduled-quality.yml"

permissions:
  contents: read

concurrency:
  group: scheduled-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: Python compile and analytics tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile API modules
        run: python -m compileall -q app
      - name: Run analytics tests
        run: pytest -q
